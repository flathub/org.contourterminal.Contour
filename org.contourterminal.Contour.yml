app-id: org.contourterminal.Contour
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: contour
finish-args:
  - --device=all          # we need access to at least DRI (for OpenGL) & PTY
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.Flatpak # Required for process `flatpak-spawn --host ...`.

modules:
  - name: contour
    buildsystem: cmake-ninja
    config-opts:
      - "-DCONTOUR_QT_VERSION=6"
      - "-DCONTOUR_INSTALL_TOOLS=ON"
      - "-DCONTOUR_TESTING=OFF"
      - "-DLIBTERMINAL_TESTING=OFF"
      - "-DCRISPY_TESTING=OFF"
    sources:
      # {{{ constructing `_deps` folder
      - type: archive
        dest: _deps/sources/GSL
        url: https://github.com/microsoft/GSL/archive/refs/tags/v3.1.0.tar.gz
        sha256: d3234d7f94cea4389e3ca70619b82e8fb4c2f33bb3a070799f1e18eef500a083

      - type: archive
        dest: _deps/sources/fmt
        url: https://github.com/fmtlib/fmt/archive/refs/tags/10.0.0.tar.gz
        sha256: ede1b6b42188163a3f2e0f25ad5c0637eca564bd8df74d02e31a311dd6b37ad8

      - type: archive
        dest: _deps/sources/termbench-pro
        url: https://github.com/contour-terminal/termbench-pro/archive/f6c37988e6481b48a8b8acaf1575495e018e9747.tar.gz
        sha256: 1e1bd99b1e525b1289807024d9dd692f7f17e61899a462727d2920ba63ebad75

      - type: archive
        dest: _deps/sources/boxed-cpp
        url: https://github.com/contour-terminal/boxed-cpp/archive/refs/tags/v1.4.3.tar.gz
        sha256: 75afd9c1627846ed350253b0885a71207a0c2d52f350ded86daa5d18712bad93

      - type: archive
        dest: _deps/sources/reflection-cpp
        url: https://github.com/contour-terminal/reflection-cpp/archive/refs/tags/v0.4.0.tar.gz
        sha256: 898e0d653860f996b0b4881d3715a4d236a25e3e82548426c6079ed5192fea08

      - type: archive
        dest: _deps/sources/libunicode
        url: https://github.com/contour-terminal/libunicode/archive/refs/tags/v0.6.0.tar.gz
        sha256: 0c217f8264000f1b8c36e78969cb9cf91ac97de937cc141ab78e6b1ad7f404ef

      - type: archive
        dest: _deps/sources/libunicode/_ucd/ucd-16.0.0
        dest-filename: ucd-16.0.0.zip
        url: https://www.unicode.org/Public/16.0.0/ucd/UCD.zip
        sha256: c86dd81f2b14a43b0cc064aa5f89aa7241386801e35c59c7984e579832634eb2
        strip-components: 0

      - type: archive
        dest: _deps/sources/range-v3
        url: https://github.com/ericniebler/range-v3/archive/refs/tags/0.12.0.tar.gz
        sha256: 015adb2300a98edfceaf0725beec3337f542af4915cec4d0b89fa0886f4ba9cb

      - type: archive
        dest: _deps/sources/Catch2
        url: https://github.com/catchorg/Catch2/archive/refs/tags/v3.4.0.tar.gz
        sha256: 122928b814b75717316c71af69bd2b43387643ba076a6ec16e7882bfb2dfacbb

      - type: archive
        dest: _deps/sources/yaml-cpp
        url: https://github.com/jbeder/yaml-cpp/archive/bbf8bdb087bb3f3621ca0a5ace06047805f4e9f3.tar.gz
        sha256: 0a9788f428a9ad58db65189fb3fc623f37f7e097ccca8632ca65f20155a649c1
        # url: https://github.com/jbeder/yaml-cpp/archive/refs/tags/0.8.0.tar.gz
        # sha256: fbe74bbdcee21d656715688706da3c8becfd946d92cd44705cc6098bb23b3a16
        # url: https://github.com/jbeder/yaml-cpp/archive/refs/tags/yaml-cpp-0.7.0.tar.gz
        # sha256: 43e6a9fcb146ad871515f0d0873947e5d497a1c9c60c58cb102a97b47208b7c3
        # url: https://github.com/jbeder/yaml-cpp/archive/refs/tags/yaml-cpp-0.6.3.tar.gz
        # sha256: 77ea1b90b3718aa0c324207cb29418f5bced2354c2e483a9523d98c3460af1ed

      - type: inline
        dest: _deps/sources
        dest-filename: CMakeLists.txt
        contents: |
          add_subdirectory(GSL EXCLUDE_FROM_ALL)

          add_subdirectory(yaml-cpp EXCLUDE_FROM_ALL)
          # add yaml-cpp to global include search path (in parent scope)
          set(YAML_CPP_INCLUDE_DIR ${CMAKE_CURRENT_SOURCE_DIR}/yaml-cpp/include PARENT_SCOPE)

          add_subdirectory(Catch2 EXCLUDE_FROM_ALL)
          add_subdirectory(fmt EXCLUDE_FROM_ALL)
          add_subdirectory(range-v3 EXCLUDE_FROM_ALL)
          macro(ContourThirdParties_Embed_boxed_cpp)
              add_subdirectory(${ContourThirdParties_SRCDIR}/boxed-cpp EXCLUDE_FROM_ALL)
          endmacro()
          macro(ContourThirdParties_Embed_termbench_pro)
              add_subdirectory(${ContourThirdParties_SRCDIR}/termbench-pro EXCLUDE_FROM_ALL)
          endmacro()
          macro(ContourThirdParties_Embed_reflection_cpp)
              add_subdirectory(${ContourThirdParties_SRCDIR}/reflection-cpp EXCLUDE_FROM_ALL)
          endmacro()
          macro(ContourThirdParties_Embed_libunicode)
              add_subdirectory(${ContourThirdParties_SRCDIR}/libunicode EXCLUDE_FROM_ALL)
          endmacro()
      # }}}

      # {{{ main contour source tree
      - type: archive
        url: https://github.com/contour-terminal/contour/archive/refs/tags/v0.6.1.7494.tar.gz
        sha256: 15090a08cf05124bf05074130cc6460d1d34c6d80f1058c63202effa032b8f6f

      # - type: dir
      #   path: /home/christianparpart/projects/contour
      #   skip:
      #     - target
      #     - _deps
      # }}}

      - type: patch
        path: post.patch
