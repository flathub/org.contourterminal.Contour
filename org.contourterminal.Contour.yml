app-id: org.contourterminal.Contour
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: contour

finish-args:
  - --device=dri          # GPU-accelerated rendering. PTYs come from /dev/pts and need no device access.
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.Flatpak     # Required for `flatpak-spawn --host ...` (escape_sandbox).
  - --talk-name=org.a11y.Bus                # AT-SPI, for the screen-reader interfaces.

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - '*.a'
  - '*.la'

# Contour resolves its third-party libraries with find_package(), so each one is an ordinary
# module installed into /app rather than being staged by hand into the source tree. The build
# runs with -DCONTOUR_USE_CPM=OFF, because CPM downloads at configure time and Flathub builds
# have no network.
modules:

  - name: microsoft-gsl
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DGSL_TEST=OFF
      # GSL 3.1.0 declares cmake_minimum_required(VERSION 3.1.3...3.16); CMake 4 rejects
      # anything below 3.5 outright.
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: archive
        url: https://github.com/microsoft/GSL/archive/refs/tags/v3.1.0.tar.gz
        sha256: d3234d7f94cea4389e3ca70619b82e8fb4c2f33bb3a070799f1e18eef500a083

  - name: yaml-cpp
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DYAML_CPP_BUILD_TESTS=OFF
      - -DYAML_CPP_BUILD_TOOLS=OFF
      - -DYAML_CPP_BUILD_CONTRIB=OFF
      - -DYAML_CPP_INSTALL=ON
      - -DYAML_BUILD_SHARED_LIBS=OFF
      # yaml-cpp 0.8.0 declares cmake_minimum_required(VERSION 3.4); CMake 4 rejects
      # anything below 3.5 outright.
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      # 0.8.0 predates GCC 13 dropping the transitive <cstdint> include, so emitterutils.cpp
      # no longer sees uint32_t. Fixed upstream after the tag; 0.8.0 is the version Contour
      # pins (cmake/ContourThirdParties.cmake) and distros ship, so force the include rather
      # than move off the tested release.
      - -DCMAKE_CXX_FLAGS=-include cstdint
    sources:
      - type: archive
        url: https://github.com/jbeder/yaml-cpp/archive/refs/tags/0.8.0.tar.gz
        sha256: fbe74bbdcee21d656715688706da3c8becfd946d92cd44705cc6098bb23b3a16

  - name: boxed-cpp
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBOXED_TESTING=OFF
    sources:
      - type: archive
        url: https://github.com/contour-terminal/boxed-cpp/archive/refs/tags/v1.4.3.tar.gz
        sha256: 75afd9c1627846ed350253b0885a71207a0c2d52f350ded86daa5d18712bad93

  - name: reflection-cpp
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DREFLECTION_TESTING=OFF
    sources:
      - type: archive
        url: https://github.com/contour-terminal/reflection-cpp/archive/refs/tags/v0.4.0.tar.gz
        sha256: 898e0d653860f996b0b4881d3715a4d236a25e3e82548426c6079ed5192fea08

  # libunicode generates its Unicode tables at build time and does not ship them in the release
  # tarball, so it would fetch UCD.zip during configure. src/libunicode/CMakeLists.txt:79 skips
  # that download when LIBUNICODE_UCD_DIR already exists, so the archive is staged there instead.
  - name: libunicode
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DLIBUNICODE_TESTING=OFF
      - -DLIBUNICODE_TOOLS=OFF
      - -DLIBUNICODE_EXAMPLES=OFF
      - -DLIBUNICODE_BENCHMARK=OFF
    sources:
      - type: archive
        url: https://github.com/contour-terminal/libunicode/archive/refs/tags/v0.9.3.tar.gz
        sha256: 78b715bc2d929530bc89e47c1c6772b72f511e1831b14e7d6d92cceb62592920
      # UCD.zip has no top-level directory, hence strip-components: 0. The version must match
      # LIBUNICODE_UCD_VERSION in libunicode's CMakeLists.txt.
      - type: archive
        url: https://www.unicode.org/Public/17.0.0/ucd/UCD.zip
        sha256: 2066d1909b2ea93916ce092da1c0ee4808ea3ef8407c94b4f14f5b7eb263d28e
        dest: _ucd/ucd-17.0.0
        strip-components: 0

  - name: contour
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCONTOUR_USE_CPM=OFF            # no network during the build
      - -DCONTOUR_TESTING=OFF            # subsumes LIBTERMINAL_TESTING / CRISPY_TESTING / NET_TESTING
      - -DLIBTERMINAL_BUILD_BENCH_HEADLESS=OFF   # would pull in termbench-pro
      - -DCONTOUR_INSTALL_TOOLS=ON
    sources:
      - type: archive
        url: https://github.com/contour-terminal/contour/archive/refs/tags/v0.7.0.8982.tar.gz
        sha256: 9afaaed7f705c56e413938f43d338c7700ca69122a531d94c10c8eb9f5a44c28
